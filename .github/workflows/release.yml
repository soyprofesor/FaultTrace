name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    # .NET Core 3.1 needs OpenSSL 1.x, which current Ubuntu images don't have.
    runs-on: windows-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            3.1.x
            6.0.x
            8.0.x
      - name: Read the version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:Version=${{ env.VERSION }}
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release -o artifacts --no-build -p:Version=${{ env.VERSION }}
      - name: Publish to nuget.org
        shell: bash
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
